name: Build AcessoFast Client (Android)
run-name: "AcessoFast Android — RustDesk ${{ inputs.version }}"

# Irmao do build-client.yml (Windows). Ficou em arquivo SEPARADO de proposito:
#   - o build Windows ja funciona e nao deve ser tocado por trabalho de Android
#   - ajustar o Android nao paga os ~48min do job Windows a cada iteracao
# Reaproveita o bridge.yml (mesmo artefato de bridge que o Windows usa).
#
# ============================================================================
# O QUE E DIFERENTE DO WINDOWS (leia antes de mexer)
# ============================================================================
#
# 1) O custom_.txt NAO EXISTE NO ANDROID.
#    No Windows a identidade entra por um arquivo gravado AO LADO do .exe, lido
#    em runtime (src/common.rs: load_custom_client -> std::fs::read_to_string do
#    diretorio do executavel). Um APK e um pacote selado: nao ha "pasta do
#    executavel" onde largar sidecar. Copiar o step do Windows aqui resultaria
#    num app identificado como "RustDesk", lendo o namespace errado.
#
#    O RustDesk ja tem o caminho certo pro Flutter, e ele e explicito no fonte:
#      flutter/android/.../MainService.kt : FFI.startServer(configPath, "")
#      src/flutter_ffi.rs                 : if custom_client_config.is_empty()
#                                             { load_custom_client() }
#                                           else { read_custom_client(cfg) }
#    Ou seja: o 2o argumento do startServer E o canal oficial. O upstream passa
#    string vazia. Nos passamos o base64 (step 'injetar identidade').
#
# 2) O patch allowCustom.py CONTINUA NECESSARIO — e por um motivo nao obvio.
#    A verificacao RSA (const KEY 5Qbwsde3un... + get_rs_pk + sign::verify) esta
#    DENTRO de read_custom_client, que e exatamente a funcao que o caminho do
#    Kotlin chama. Sem o patch, o nosso base64 nao-assinado e RECUSADO.
#    E o pior: recusa em SILENCIO (so um log::error e `return`) — o build sai
#    verde e entrega um APK "RustDesk". Por isso o step de sanidade abaixo
#    FALHA O BUILD em vez de avisar.
#
# 3) Assinatura: o upstream do RustDesk troca signingConfigs.release por .debug
#    ("temporary use debug sign config"). NAO seguimos isso. Um APK debug-signed
#    nao atualiza por cima de um release-signed depois — prenderia a base
#    instalada. Assinamos release de verdade, via secrets.
#
# ============================================================================
# REQUISITOS (o build aborta em ~10s se faltarem)
# ============================================================================
#   - repo VARIABLES: RELAY_HOST, RELAY_PUBKEY  (aba Variables, nao Secrets)
#   - repo SECRETS:   ANDROID_SIGNING_KEY (base64 do .jks),
#                     ANDROID_SIGNING_ALIAS,
#                     ANDROID_SIGNING_STORE_PASSWORD,
#                     ANDROID_SIGNING_KEY_PASSWORD
#   - branding/icon.png (quadrado, >=192px)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag do RustDesk a buildar (ex: 1.4.9)'
        required: true
        default: '1.4.9'
        type: string
      gerar_aab:
        description: 'Gerar tambem o .aab (Android App Bundle) para publicar na Play Store'
        required: false
        default: false
        type: boolean

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VERSION: "${{ inputs.version }}"

  # ---------------- Identidade AcessoFast (igual ao build Windows) ------------
  appname: "AcessoFast"
  compname: "AcessoFast"

  # applicationId do APK. TROCADO de propósito: o upstream usa
  # com.carriez.flutter_hbb, que (a) colide com o RustDesk oficial no mesmo
  # aparelho e (b) nao poderia ser publicado como app nosso na Play Store.
  # O sufixo '.mobile' e escolha do Ryan (2026-07-31), pra identificacao — nao ha
  # necessidade tecnica, ja que o client desktop nao tem applicationId.
  # ATENCAO: depois de publicado, applicationId NUNCA MAIS MUDA. Confirmar antes
  # do primeiro APK que sair pra cliente.
  applicationId: "br.com.aspsoftwares.acessofast.mobile"

  # ---------------- Plano de dados: relay proprio -----------------------------
  server: "${{ vars.RELAY_HOST }}"
  key: "${{ vars.RELAY_PUBKEY }}"
  apiServer: ""

  # ---------------- Identidade injetada no MainService.kt ---------------------
  # MESMO base64 do build-client.yml (Windows) — os dois clientes tem que
  # concordar em app-name e override-settings, senao o parque fica com duas
  # politicas diferentes. Se mudar la, mude aqui.
  # Decodifica para:
  # {"app-name":"AcessoFast","override-settings":{"approve-mode":"password-click",
  #  "allow-remote-config-modification":"N","allow-logon-screen-password":"Y"}}
  custom: "eyJhcHAtbmFtZSI6IkFjZXNzb0Zhc3QiLCJvdmVycmlkZS1zZXR0aW5ncyI6eyJhcHByb3ZlLW1vZGUiOiJwYXNzd29yZC1jbGljayIsImFsbG93LXJlbW90ZS1jb25maWctbW9kaWZpY2F0aW9uIjoiTiIsImFsbG93LWxvZ29uLXNjcmVlbi1wYXNzd29yZCI6IlkifX0="

jobs:
  # Mesmo guard do build Windows: sem as vars o sed do config.rs troca o relay
  # por string VAZIA, o build fica verde e entrega um cliente que nao conecta
  # em lugar nenhum. Custa ~10s e aborta antes dos ~40min.
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Vars obrigatorias (RELAY_HOST / RELAY_PUBKEY)
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          if [ -z "${{ vars.RELAY_HOST }}" ]; then
            echo "::error::vars.RELAY_HOST vazio (aba Variables, nao Secrets)."; fail=1
          fi
          if [ -z "${{ vars.RELAY_PUBKEY }}" ]; then
            echo "::error::vars.RELAY_PUBKEY vazio (aba Variables, nao Secrets)."; fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "relay ok."

      - name: Secrets de assinatura obrigatorios
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          [ -n "${{ secrets.ANDROID_SIGNING_KEY }}" ]            || { echo "::error::secret ANDROID_SIGNING_KEY ausente."; fail=1; }
          [ -n "${{ secrets.ANDROID_SIGNING_ALIAS }}" ]          || { echo "::error::secret ANDROID_SIGNING_ALIAS ausente."; fail=1; }
          [ -n "${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}" ] || { echo "::error::secret ANDROID_SIGNING_STORE_PASSWORD ausente."; fail=1; }
          [ -n "${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}" ]   || { echo "::error::secret ANDROID_SIGNING_KEY_PASSWORD ausente."; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "secrets de assinatura ok."

      - name: Sanidade do custom (identidade)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ env.custom }}" ]; then
            echo "::error::env.custom vazio — o APK sairia identificado como RustDesk."
            exit 1
          fi
          echo "custom decodificado:"
          echo -n "${{ env.custom }}" | base64 -d
          echo ""

      - name: Branding e agente presentes
        shell: bash
        run: |
          set -euo pipefail
          [ -f ./branding/icon.png ] || { echo "::error::branding/icon.png ausente."; exit 1; }
          [ -f ./branding/notification-icon.png ] || { echo "::error::branding/notification-icon.png ausente (icone da barra de status)."; exit 1; }
          [ -f ./mobile/agent.dart ] || { echo "::error::mobile/agent.dart ausente."; exit 1; }
          [ -f ./mobile/onboarding.dart ] || { echo "::error::mobile/onboarding.dart ausente."; exit 1; }
          [ -f ./mobile/session.dart ] || { echo "::error::mobile/session.dart ausente."; exit 1; }
          echo "branding e agente ok."

  generate-bridge:
    needs: preflight
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ inputs.version }}

  build-for-android:
    name: Build Android
    needs: [preflight, generate-bridge]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          # v1: so arm64-v8a. Cobre praticamente todo aparelho de 2017 pra ca e
          # e 1 ciclo de build em vez de 3. Pra adicionar, descomente — os steps
          # ja sao parametrizados por matrix.
          - { arch: aarch64, target: aarch64-linux-android, abi: arm64-v8a, ndk_script: ndk_arm64.sh }
          # - { arch: armv7,  target: armv7-linux-androideabi, abi: armeabi-v7a, ndk_script: ndk_arm.sh }
          # - { arch: x86_64, target: x86_64-linux-android,    abi: x86_64,      ndk_script: ndk_x64.sh }

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout Repository
        uses: actions/checkout@v4

      # CRITICO: o checkout de rustdesk/rustdesk (adiante) sobrescreve o
      # workspace e apagaria ./branding/. Salvamos fora do workspace primeiro.
      # (mesma razao e mesmo mecanismo do build Windows)
      - name: Preservar branding e agente fora do workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/af-branding" "$RUNNER_TEMP/af-agent"
          cp ./branding/icon.png "$RUNNER_TEMP/af-branding/icon.png"
          # icone da notificacao (barra de status) — mesmo motivo do icon.png:
          # o checkout do rustdesk apaga ./branding/.
          cp ./branding/notification-icon.png "$RUNNER_TEMP/af-branding/notification-icon.png"
          # agent.dart precisa sobreviver ao checkout do rustdesk pelo mesmo
          # motivo do branding: o checkout sobrescreve o workspace inteiro.
          cp ./mobile/agent.dart ./mobile/onboarding.dart ./mobile/session.dart "$RUNNER_TEMP/af-agent/"
          echo "AF_BRANDING=$RUNNER_TEMP/af-branding" >> "$GITHUB_ENV"
          echo "AF_AGENT=$RUNNER_TEMP/af-agent" >> "$GITHUB_ENV"
          ls -la "$RUNNER_TEMP/af-branding" "$RUNNER_TEMP/af-agent"

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang cmake curl gcc-multilib git g++ g++-multilib \
               libasound2-dev libc6-dev libclang-dev libunwind-dev \
               libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev libpam0g-dev libpulse-dev libva-dev \
               libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
               libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
               openjdk-17-jdk-headless pkg-config tree wget imagemagick

      - name: Checkout source code (tag)
        if: ${{ env.VERSION != 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Checkout source code (master)
        if: ${{ env.VERSION == 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      # ---------------------------------------------------------------------
      # BRANDING — subconjunto do build Windows que faz sentido em Android.
      # Ficaram de fora: Runner.rc, libs/portable, res/msi (tudo Windows-only).
      # ---------------------------------------------------------------------
      - name: change appname to custom
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|description = "RustDesk Remote Desktop"|description = "${{ env.appname }}"|' ./Cargo.toml
          if [ -n "${{ env.compname }}" ]; then
            find ./src/lang -name "*.rs" -exec sed -i '/powered_by_me/s|RustDesk|${{ env.compname }}|g' {} \;
          fi
          find ./src/lang -name "*.rs" -exec sed -i -e 's|RustDesk|${{ env.appname }}|' {} \;

      - name: change company name
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./flutter/lib/mobile/pages/settings_page.dart
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./flutter/lib/mobile/pages/settings_page.dart

      # O build Windows ja tocava nestes arquivos mobile — mantido igual.
      - name: change url and download link
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e "s|const url = 'https://rustdesk.com/';|const url = '';|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i -e 's|https://rustdesk.com/download|#|' ./flutter/lib/mobile/pages/connection_page.dart

      # SOBERANIA: relay proprio hardcoded + admin.rustdesk.com zerado.
      # Este step e o mais critico do build inteiro: se falhar silenciosamente o
      # APK nao conecta em lugar nenhum. Por isso NAO tem continue-on-error e
      # tem verificacao explicita depois.
      - name: set server, key, and apiserver
        shell: bash
        run: |
          set -euo pipefail
          sed -i -e 's|rs-ny.rustdesk.com|${{ env.server }}|' ./libs/hbb_common/src/config.rs
          sed -i -e 's|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|${{ env.key }}|' ./libs/hbb_common/src/config.rs
          sed -i -e 's|https://admin.rustdesk.com|${{ env.apiServer }}|' ./src/common.rs
          echo "--- verificacao ---"
          if grep -q 'rs-ny.rustdesk.com' ./libs/hbb_common/src/config.rs; then
            echo "::error::relay do RustDesk ainda presente no config.rs — o sed nao pegou."
            exit 1
          fi
          if grep -q 'admin.rustdesk.com' ./src/common.rs; then
            echo "::error::admin.rustdesk.com ainda presente em common.rs."
            exit 1
          fi
          echo "relay/key/apiserver aplicados."

      # AcessoFast (auto-adocao): identico ao build Windows. O agente embutido no
      # app Android vai parsear a mesma linha, entao o patch tem que existir aqui
      # tambem — senao o Android nunca auto-adota.
      - name: log peer_id no connection.rs (auto-adocao AcessoFast)
        shell: bash
        run: |
          set -euo pipefail
          f=./src/server/connection.rs
          anchor='self.lr = lr.clone();'
          if ! grep -qF "$anchor" "$f"; then
            echo "::error::ancora '$anchor' nao encontrada em $f — RustDesk mudou; revisar o patch de peer_id."
            exit 1
          fi
          if grep -qF 'peer_id {}' "$f"; then
            echo "peer_id ja presente, pulando."
          else
            sed -i -e 's|self.lr = lr.clone();|self.lr = lr.clone();\n        log::info!("#{} peer_id {}", self.inner.id, lr.my_id);|' "$f"
          fi
          grep -n 'peer_id' "$f"

      # SEM ISTO O APK SAI COMO "RustDesk". Ver cabecalho, item (2): a verificacao
      # RSA vive DENTRO de read_custom_client — a mesma funcao que o caminho do
      # Kotlin chama — e recusa nosso base64 em silencio.
      - name: allow custom.txt (remove verificacao RSA do read_custom_client)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o allowCustom.py \
            https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/allowCustom.py
          python3 allowCustom.py
          if grep -q '5Qbwsde3unUcJBtrx9ZkvUmwFNoExHzpryHuPUdqlWM=' ./src/common.rs; then
            echo "::error::a chave RSA do RustDesk continua em common.rs — allowCustom.py nao aplicou."
            exit 1
          fi
          echo "verificacao RSA removida."

      # ---------------------------------------------------------------------
      # O STEP ESPECIFICO DE ANDROID. Ver cabecalho, item (1).
      # ---------------------------------------------------------------------
      - name: Injetar identidade AcessoFast no MainService.kt
        shell: bash
        run: |
          set -euo pipefail
          f=./flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt
          anchor='FFI.startServer(configPath, "")'
          if ! grep -qF "$anchor" "$f"; then
            echo "::error::ancora 'FFI.startServer(configPath, \"\")' nao encontrada em $f."
            echo "::error::O RustDesk mudou o ponto de entrada do Android — revisar antes de seguir."
            exit 1
          fi
          sed -i -e "s|FFI.startServer(configPath, \"\")|FFI.startServer(configPath, \"${{ env.custom }}\")|" "$f"
          echo "--- resultado ---"
          grep -n 'FFI.startServer' "$f"

      # SEGUNDO CAMINHO DA IDENTIDADE — sem isto o app abre como "RustDesk".
      #
      # Descoberto no run #3: o MainService.kt (step acima) e o servico de
      # COMPARTILHAMENTO DE TELA — so sobe quando alguem comeca a compartilhar.
      # Na abertura do app, o Flutter inicializa o nucleo com config vazia:
      #
      #   src/flutter_ffi.rs — fn initialize(app_dir, custom_client_config)
      #     if custom_client_config.is_empty() { load_custom_client() }   <- ESTE
      #     else { read_custom_client(custom_client_config) }             <- MainService
      #
      # O load_custom_client procura o custom.txt no diretorio do executavel —
      # que no Android nao existe (§ cabecalho, item 1). Resultado: APP_NAME
      # continua "RustDesk" e o titulo do app sai errado, mesmo com o
      # MainService injetado corretamente.
      #
      # Aqui fechamos o caminho de abertura: load_custom_client passa a aplicar
      # a identidade direto, sem tocar em disco. Os dois caminhos agora levam ao
      # mesmo lugar.
      - name: Injetar identidade no load_custom_client (caminho de abertura)
        shell: bash
        run: |
          set -euo pipefail
          f=./src/common.rs
          anchor='pub fn load_custom_client() {'
          if ! grep -qF "$anchor" "$f"; then
            echo "::error::ancora 'pub fn load_custom_client() {' nao encontrada em $f."
            exit 1
          fi
          if grep -qF 'AcessoFast custom client' "$f"; then
            echo "ja injetado, pulando."
          else
            sed -i -e 's|pub fn load_custom_client() {|// AcessoFast custom client (injetado no CI)\n#[allow(unreachable_code)]\npub fn load_custom_client() {\n    read_custom_client("${{ env.custom }}");\n    return;|' "$f"
          fi
          echo "--- resultado ---"
          grep -n -A 4 'pub fn load_custom_client' "$f"

      - name: Sanidade da identidade (FALHA o build se nao entrou)
        shell: bash
        run: |
          set -euo pipefail
          f=./flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt
          if grep -qF 'FFI.startServer(configPath, "")' "$f"; then
            echo "::error::MainService.kt ainda passa string VAZIA — o APK sairia como RustDesk."
            exit 1
          fi
          if ! grep -qF '${{ env.custom }}' "$f"; then
            echo "::error::o base64 da identidade nao esta no MainService.kt."
            exit 1
          fi
          # Caminho 2: abertura do app (load_custom_client). Sem este, o app
          # abre como "RustDesk" mesmo com o MainService correto — foi o run #3.
          c=./src/common.rs
          if ! grep -qF '${{ env.custom }}' "$c"; then
            echo "::error::o base64 da identidade nao esta no load_custom_client (common.rs)."
            echo "::error::O app abriria como RustDesk. Ver step 'caminho de abertura'."
            exit 1
          fi
          echo "identidade AcessoFast conferida nos DOIS caminhos (abertura + servico)."

      # applicationId proprio: sem isto o APK colide com o RustDesk oficial no
      # mesmo aparelho e nao poderia ir pra Play Store como app nosso.
      - name: Trocar applicationId
        shell: bash
        run: |
          set -euo pipefail
          f=./flutter/android/app/build.gradle
          if ! grep -qF 'applicationId "com.carriez.flutter_hbb"' "$f"; then
            echo "::error::applicationId padrao nao encontrado em $f."
            exit 1
          fi
          sed -i -e 's|applicationId "com.carriez.flutter_hbb"|applicationId "${{ env.applicationId }}"|' "$f"
          grep -n 'applicationId' "$f"

      # O NOME QUE O USUARIO VE VEM DAQUI — nao do read_custom_client.
      # Descoberto no run #2: o APK instalou como "RustDesk" mesmo com a
      # identidade injetada corretamente. Sao camadas diferentes:
      #   - android:label (AndroidManifest)  -> nome na gaveta de apps/instalador
      #   - app-name do custom (base64)      -> config::APP_NAME no runtime do Rust
      #                                         (namespace de config, textos internos)
      # Precisamos DOS DOIS. O segundo ja estava; este step fecha o primeiro.
      #
      # O 'RustDesk Input' e o nome do SERVICO DE ACESSIBILIDADE — e exatamente o
      # que o cliente le em Configuracoes > Acessibilidade na hora de liberar o
      # controle remoto. Deixar "RustDesk" ali seria confuso e mina a confianca.
      - name: Branding do AndroidManifest (nome do app e do servico)
        shell: bash
        run: |
          set -euo pipefail
          f=./flutter/android/app/src/main/AndroidManifest.xml
          if ! grep -qF 'android:label="RustDesk"' "$f"; then
            echo "::error::android:label=\"RustDesk\" nao encontrado em $f — RustDesk mudou o manifest."
            exit 1
          fi
          # 'RustDesk Input' primeiro: e uma string mais longa e especifica.
          sed -i -e 's|android:label="RustDesk Input"|android:label="${{ env.appname }} Input"|' "$f"
          sed -i -e 's|android:label="RustDesk"|android:label="${{ env.appname }}"|' "$f"
          echo "--- resultado ---"
          grep -n 'android:label' "$f"
          if grep -q 'android:label="RustDesk' "$f"; then
            echo "::error::ainda restou android:label com RustDesk no manifest."
            exit 1
          fi
          echo "manifest branded."

      # Os ultimos "RustDesk" visiveis ao usuario, achados testando o run #4:
      #   - DEFAULT_NOTIFY_TITLE: titulo da notificacao permanente que fica na
      #     barra enquanto o compartilhamento roda. E o que o cliente ve o tempo
      #     todo durante um atendimento.
      #   - app_name (strings.xml): recurso de nome do app.
      #   - accessibility_service_description: o texto explicativo em
      #     Configuracoes > Acessibilidade, na hora de liberar o controle.
      - name: Branding de strings Android (notificacao e acessibilidade)
        shell: bash
        run: |
          set -euo pipefail
          ms=./flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt
          st=./flutter/android/app/src/main/res/values/strings.xml

          if ! grep -qF 'const val DEFAULT_NOTIFY_TITLE = "RustDesk"' "$ms"; then
            echo "::error::DEFAULT_NOTIFY_TITLE nao encontrado em $ms."
            exit 1
          fi
          sed -i -e 's|const val DEFAULT_NOTIFY_TITLE = "RustDesk"|const val DEFAULT_NOTIFY_TITLE = "${{ env.appname }}"|' "$ms"

          if ! grep -qF '<string name="app_name">RustDesk</string>' "$st"; then
            echo "::error::app_name nao encontrado em $st."
            exit 1
          fi
          sed -i -e 's|<string name="app_name">RustDesk</string>|<string name="app_name">${{ env.appname }}</string>|' "$st"
          # descricao do servico de acessibilidade (cita "RustDesk" no meio da frase)
          sed -i -e 's|when RustDesk screen sharing|when ${{ env.appname }} screen sharing|' "$st"

          echo "--- resultado ---"
          cat "$st"
          grep -n 'DEFAULT_NOTIFY_TITLE' "$ms"
          if grep -q 'RustDesk' "$st"; then
            echo "::error::ainda ha 'RustDesk' em strings.xml."
            exit 1
          fi
          echo "strings Android branded."

      # O AcessoFast NAO mostra o aviso "SCAM" do RustDesk. O dialogo so aparece
      # quando gFFI.userModel.userName esta vazio — e o cliente AcessoFast NUNCA
      # faz login, entao ele aparecia TODA vez que o cliente ia ligar o servico.
      # No nosso fluxo (adocao pelo painel, senha servida pelo painel) ele nao faz
      # sentido e ainda assusta o cliente. Neutralizamos showScamWarning para so
      # ligar o servico direto, sem dialogo. Mesmo padrao de âncora do
      # load_custom_client (injeta corpo + return). O showDialog que sobra vira
      # dead-code, que e um lint do analyzer e NAO falha o `flutter build`.
      - name: Remover aviso de golpe (scam warning)
        shell: bash
        run: |
          set -euo pipefail
          f=./flutter/lib/mobile/pages/server_page.dart
          anchor='void showScamWarning(BuildContext context, ServerModel serverModel) {'
          if ! grep -qF "$anchor" "$f"; then
            echo "::error::ancora do showScamWarning nao encontrada em $f — RustDesk mudou o server_page.dart."
            exit 1
          fi
          if grep -qF 'AcessoFast: sem aviso de golpe' "$f"; then
            echo "ja neutralizado, pulando."
          else
            sed -i -e 's|void showScamWarning(BuildContext context, ServerModel serverModel) {|void showScamWarning(BuildContext context, ServerModel serverModel) {\n  // AcessoFast: sem aviso de golpe — liga o servico direto, sem o dialogo.\n  serverModel.toggleService();\n  return;|' "$f"
          fi
          echo "--- resultado ---"
          grep -n -A 3 'void showScamWarning' "$f"
          if ! grep -qF 'AcessoFast: sem aviso de golpe' "$f"; then
            echo "::error::patch do scam warning nao aplicou."
            exit 1
          fi

      # Janela flutuante INVISIVEL (nao desativada). Historia:
      #   1a tentativa: desativamos o FloatingWindowService de vez, pra sumir com
      #   o icone flutuante que o cliente reclamou. Efeito colateral GRAVE: esse
      #   overlay e o que segura FLAG_KEEP_SCREEN_ON durante o controle. Sem ele,
      #   settings_page/server_model caem em KeepScreenOn.never -> a tela apaga no
      #   meio do atendimento e a imagem some ("perde a imagem se a tela apagar").
      #
      # Solucao: deixamos o overlay RODANDO, mas 100% transparente. transparency
      # = 0f => alpha 0 (invisivel) e, no proprio codigo, ja liga FLAG_NOT_TOUCHABLE
      # ("if (viewUntouchable || viewTransparency == 0f)"), entao nao intercepta
      # toque. O cliente nao ve icone nenhum, e o keep-screen-on volta a funcionar.
      # Custo: precisa da permissao "sobrepor a outros apps" (overlay), que o
      # toggleService ja pede — nao e "configuracao restrita", e so um toggle.
      - name: Janela flutuante invisivel (mantem keep-screen-on, sem icone)
        shell: bash
        run: |
          set -euo pipefail
          f=./flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/FloatingWindowService.kt
          anchor='private var viewTransparency = 1f'
          if ! grep -qF "$anchor" "$f"; then
            echo "::error::ancora 'viewTransparency = 1f' nao encontrada em $f — RustDesk mudou o FloatingWindowService.kt."
            exit 1
          fi
          sed -i -e 's|private var viewTransparency = 1f|private var viewTransparency = 0f|' "$f"
          echo "--- resultado ---"
          grep -n 'private var viewTransparency' "$f"
          if ! grep -qF 'private var viewTransparency = 0f' "$f"; then
            echo "::error::patch da janela invisivel nao aplicou."
            exit 1
          fi

      # Notificacao do foreground service menos intrusiva. O canal do RustDesk e
      # IMPORTANCE_HIGH (faz som/heads-up e fica no topo). Baixamos pra LOW: o
      # icone continua aparecendo (branding), mas sem som e mais discreto.
      # OBS pro cliente (imagem 6): a notificacao "Servico esta em execucao" NAO
      # pode ser deslizada enquanto o servico roda — e exigencia do Android pra
      # foreground service (e justamente o que segura o app vivo). LOW e o maximo
      # que da pra suavizar sem perder o servico em background.
      - name: Notificacao discreta (IMPORTANCE_LOW)
        shell: bash
        run: |
          set -euo pipefail
          f=./flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt
          if ! grep -qF 'NotificationManager.IMPORTANCE_HIGH' "$f"; then
            echo "::error::IMPORTANCE_HIGH nao encontrado em $f — RustDesk mudou o MainService.kt."
            exit 1
          fi
          sed -i -e 's|NotificationManager.IMPORTANCE_HIGH|NotificationManager.IMPORTANCE_LOW|' "$f"
          echo "--- resultado ---"
          grep -n 'IMPORTANCE_' "$f"

      # Imagem some ao RECONECTAR (fica "aguardando pela imagem", so volta se
      # desligar/ligar a captura). Causa: em startCapture(), o listener do
      # imageReader descarta frames enquanto _isStart==false; e _isStart so vira
      # true DEPOIS de criar surface+virtualDisplay. Numa tela parada, o unico
      # frame pos-resume chega nesse intervalo, e descartado, e nao vem outro ->
      # o controlador espera pra sempre. Setar _isStart ANTES de criar a surface
      # fecha essa janela. Fica DEPOIS do updateScreenInfo de proposito (senao
      # cairia no ramo 'if (isStart) { stopCapture; ...; startCapture }' e
      # recursaria). O _isStart = true original mais abaixo vira redundante/inocuo.
      - name: Corrigir imagem ao reconectar (isStart antes da surface)
        shell: bash
        run: |
          set -euo pipefail
          f=./flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt
          anchor='surface = createSurface()'
          if ! grep -qF "$anchor" "$f"; then
            echo "::error::ancora 'surface = createSurface()' nao encontrada em $f."
            exit 1
          fi
          if grep -qF 'AcessoFast: isStart antes da surface' "$f"; then
            echo "ja aplicado, pulando."
          else
            sed -i -e 's|surface = createSurface()|_isStart = true // AcessoFast: isStart antes da surface (nao perde o 1o frame ao reconectar)\n        surface = createSurface()|' "$f"
          fi
          echo "--- resultado ---"
          grep -n 'createSurface()\|isStart antes da surface' "$f"

      - name: removeNewVersionNotif
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|https://api.github.com/repos/rustdesk/rustdesk/releases/latest||' ./src/common.rs

      # SEM continue-on-error de proposito: no run #2 este step passou "verde" e
      # mesmo assim o aparelho mostrou o icone do RustDesk. Falha silenciosa de
      # branding e o que este workflow inteiro tenta evitar.
      #
      # A causa era o ICONE ADAPTATIVO: o RustDesk traz
      # mipmap-anydpi-v26/ic_launcher.xml, e no Android 8+ o XML adaptativo tem
      # PRIORIDADE sobre os PNGs por densidade. Trocar so os PNGs nao muda nada
      # no aparelho. Removemos os XMLs -> @mipmap/ic_launcher volta a resolver
      # pros PNGs que geramos aqui.
      # (Trade-off aceito: perde-se o mascaramento adaptativo do launcher. Em v1
      # vale mais a marca correta do que o formato bonito.)
      - name: Icone do launcher (branding)
        shell: bash
        run: |
          set -euo pipefail
          src="$AF_BRANDING/icon.png"
          res=./flutter/android/app/src/main/res
          rm -f "$res/mipmap-anydpi-v26/ic_launcher.xml" \
                "$res/mipmap-anydpi-v26/ic_launcher_round.xml"
          rmdir "$res/mipmap-anydpi-v26" 2>/dev/null || true

          # ImageMagick 7 renomeou `convert` para `magick`; aceitamos os dois.
          IM=convert
          command -v magick >/dev/null 2>&1 && IM=magick

          declare -A d=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for k in "${!d[@]}"; do
            out="$res/mipmap-$k"
            mkdir -p "$out"
            "$IM" "$src" -resize "${d[$k]}x${d[$k]}" "$out/ic_launcher.png"
            cp "$out/ic_launcher.png" "$out/ic_launcher_round.png"
          done

          # Verificacao: sem XML adaptativo sobrando e com PNG de fato gerado.
          if [ -f "$res/mipmap-anydpi-v26/ic_launcher.xml" ]; then
            echo "::error::ic_launcher.xml adaptativo ainda existe — o icone do RustDesk venceria."
            exit 1
          fi
          [ -s "$res/mipmap-xxxhdpi/ic_launcher.png" ] || {
            echo "::error::ic_launcher.png nao foi gerado."; exit 1; }
          echo "icones do launcher aplicados:"
          ls -la "$res/mipmap-xxxhdpi/"

      # Icone da NOTIFICACAO (barra de status). E o que MainService.kt referencia
      # em setSmallIcon(R.mipmap.ic_stat_logo) — a seta da imagem 2 do cliente.
      # A notificacao NAO e removida (ela e o que segura o foreground service vivo
      # nas fabricantes agressivas; e o titulo ja sai "AcessoFast"). So trocamos o
      # icone, que ainda era o do RustDesk.
      #
      # O Android renderiza o small icon como SILHUETA: usa so o canal alpha e
      # pinta de branco. Por isso forcamos RGB=branco (mantendo o alpha) — o
      # source ja e branco, isto e cinto-e-suspensorio — e centralizamos num
      # canvas QUADRADO transparente (o source e 256x195; sem isso distorceria).
      # Tamanhos padrao de status bar: 24dp por densidade.
      - name: Icone da notificacao (ic_stat_logo)
        shell: bash
        run: |
          set -euo pipefail
          src="$AF_BRANDING/notification-icon.png"
          res=./flutter/android/app/src/main/res
          [ -f "$src" ] || { echo "::error::notification-icon.png nao preservado."; exit 1; }

          IM=convert
          command -v magick >/dev/null 2>&1 && IM=magick

          # -trim tira a moldura transparente do source (256x195, simbolo com
          # muita margem) ANTES de redimensionar — sem isso o "A" saia minusculo
          # na barra (imagem 5, comparado ao Discord). Depois centraliza num
          # canvas quadrado, deixando ~8% de respiro pra nao colar nas bordas.
          declare -A d=( [mdpi]=24 [hdpi]=36 [xhdpi]=48 [xxhdpi]=72 [xxxhdpi]=96 )
          for k in "${!d[@]}"; do
            sz=${d[$k]}
            inner=$(( sz * 92 / 100 ))
            out="$res/mipmap-$k"
            mkdir -p "$out"
            "$IM" "$src" -channel RGB -evaluate set 100% +channel \
              -trim +repage \
              -resize "${inner}x${inner}" -background none -gravity center -extent "${sz}x${sz}" \
              "$out/ic_stat_logo.png"
          done

          [ -s "$res/mipmap-xxxhdpi/ic_stat_logo.png" ] || {
            echo "::error::ic_stat_logo.png nao foi gerado."; exit 1; }
          echo "icone da notificacao aplicado:"
          ls -la "$res"/mipmap-*/ic_stat_logo.png

      # ---------------------------------------------------------------------
      # AGENTE EMBUTIDO (etapa 5 do MOBILE-DESIGN.md) — matricula por nonce.
      # Porte do matricula.go. Mesmos endpoints do agente Windows, nenhuma edge
      # function nova.
      #
      # Vem como ARQUIVO NOVO (mobile/agent.dart -> flutter/lib/acessofast/) em
      # vez de sed espalhado: o build parte de uma TAG do rustdesk/rustdesk, e
      # patch por sed quebra a cada upgrade. Assim so dependemos de duas
      # ancoras no main.dart, ambas verificadas abaixo.
      - name: Instalar o agente AcessoFast (agent.dart)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./flutter/lib/acessofast
          cp "$AF_AGENT/agent.dart" ./flutter/lib/acessofast/agent.dart
          cp "$AF_AGENT/onboarding.dart" ./flutter/lib/acessofast/onboarding.dart
          cp "$AF_AGENT/session.dart" ./flutter/lib/acessofast/session.dart
          echo "agent.dart      ($(wc -l < ./flutter/lib/acessofast/agent.dart) linhas)"
          echo "onboarding.dart ($(wc -l < ./flutter/lib/acessofast/onboarding.dart) linhas)"
          echo "session.dart    ($(wc -l < ./flutter/lib/acessofast/session.dart) linhas)"

          # O agente usa sha256 (protocolo do claim) e o RustDesk nao declara o
          # pacote crypto. E pure-Dart, do time do Dart, sem codigo nativo.
          p=./flutter/pubspec.yaml
          if grep -qE '^\s+crypto:' "$p"; then
            echo "crypto ja declarado."
          else
            if ! grep -qE '^\s+http:\s' "$p"; then
              echo "::error::ancora 'http:' nao encontrada em $p."
              exit 1
            fi
            sed -i -e '0,/^\(\s\+\)http:\s/s//\1crypto: ^3.0.3\n&/' "$p"
            grep -nE '^\s+(crypto|http):' "$p"
          fi

      - name: Enganchar o agente no main.dart
        shell: bash
        run: |
          set -euo pipefail
          f=./flutter/lib/main.dart
          imp="import 'package:flutter_hbb/models/state_model.dart';"
          call='if (isAndroid) platformFFI.syncAndroidServiceAppDirConfigPath();'

          for a in "$imp" "$call"; do
            if ! grep -qF "$a" "$f"; then
              echo "::error::ancora nao encontrada em main.dart: $a"
              echo "::error::O RustDesk mudou o arquivo — revisar antes de seguir."
              exit 1
            fi
          done

          if grep -qF 'acessofast/agent.dart' "$f"; then
            echo "ja enganchado, pulando."
          else
            # import: logo apos um import estavel do proprio flutter_hbb
            sed -i -e "s|$imp|$imp\nimport 'package:flutter_hbb/acessofast/agent.dart';|" "$f"
            # chamada: em runMobileApp, DEPOIS do config path (o agente grava
            # estado em disco) e ANTES do runApp — nao bloqueia, so dispara.
            sed -i -e "s|$call|$call\n  if (isAndroid) acessofastAgentStart();|" "$f"
          fi

          echo "--- resultado ---"
          grep -n 'acessofast' "$f"
          if ! grep -qF 'acessofastAgentStart();' "$f"; then
            echo "::error::a chamada do agente nao entrou no main.dart."
            exit 1
          fi
          echo "agente enganchado."

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{ env.ANDROID_FLUTTER_VERSION }} ]] && git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff || true

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh "${{ matrix.job.abi }}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do
              echo "$f:"; echo "======"; cat "$f"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: acessofast-android
          key: ${{ matrix.job.target }}
          # Default e false: cache só é salvo quando o job passa. Como as falhas
          # tendem a ser no fim (Gradle/APK), sem isto cada tentativa recompila
          # o Rust inteiro do zero. Salvar em falha e o que torna a iteracao viavel.
          cache-on-failure: true

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/${{ matrix.job.ndk_script }}
          mkdir -p ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}
          cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so \
             ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}/librustdesk.so

      # Assinatura RELEASE de verdade — NAO o signingConfigs.debug do upstream.
      # O build.gradle do RustDesk le de flutter/android/key.properties
      # (keyAlias / keyPassword / storeFile / storePassword).
      - name: Configurar assinatura release
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # CAMINHO ABSOLUTO, de proposito. key.properties e lido de
          # rootProject (flutter/android/), MAS o `file(storeFile)` do
          # signingConfigs e avaliado no modulo app/ — um caminho relativo
          # resolveria pra flutter/android/app/ e o Gradle nao acharia o
          # keystore. Foi exatamente o que quebrou o run #1 (assembleRelease
          # exit 1). Absoluto elimina a ambiguidade de contexto.
          KEYSTORE_PATH="$GITHUB_WORKSPACE/flutter/android/acessofast-upload.jks"
          echo -n "$SIGNING_KEY" | base64 -d > "$KEYSTORE_PATH"
          # nada de echo do conteudo: so o tamanho, pra diagnostico
          echo "keystore decodificado: $(wc -c < "$KEYSTORE_PATH") bytes em $KEYSTORE_PATH"

          # Valida o keystore ANTES do Gradle. Pega os 3 erros mais provaveis de
          # secret (base64 corrompido, storePassword errada, alias inexistente)
          # em ~2s, em vez de depois de todo o build. keytool -list nao imprime
          # segredo: so alias e fingerprint do certificado.
          if ! keytool -list -keystore "$KEYSTORE_PATH" \
                 -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_ALIAS" > /dev/null 2>&1; then
            echo "::error::keystore invalido, storePassword errada ou alias '$SIGNING_ALIAS' inexistente."
            echo "::error::Confira os secrets ANDROID_SIGNING_KEY / _STORE_PASSWORD / _ALIAS."
            exit 1
          fi
          echo "keystore validado (alias '$SIGNING_ALIAS' encontrado)."

          cat > ./flutter/android/key.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF
          # Guard: se o upstream mudar e o release sumir, o APK sairia debug-signed.
          if ! grep -qF 'signingConfig signingConfigs.release' ./flutter/android/app/build.gradle; then
            echo "::error::build.gradle nao usa signingConfigs.release — APK sairia mal assinado."
            exit 1
          fi
          echo "assinatura release configurada."

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so \
             ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}/
          # Versao do agente embutido (mobile/session.dart le via
          # String.fromEnvironment). Mesmo formato do agente Windows —
          # AAAA.MM.DD-<sha7> — pra que os dois sejam comparaveis na coluna
          # "Agente" do painel. Sem isto o APK reporta "dev" e o aparelho aparece
          # no painel com versao desconhecida.
          AGENT_VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          echo "::notice::agent_version=${AGENT_VERSION}"
          # Exportado pro step do AAB usar o MESMO valor. Recalcular la daria uma
          # segunda copia do formato (livre pra divergir) e, num build que cruze a
          # meia-noite UTC, o .aab sairia com data diferente do .apk do mesmo commit.
          echo "AGENT_VERSION=${AGENT_VERSION}" >> "$GITHUB_ENV"
          pushd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi \
            --dart-define=ACESSOFAST_VERSION="${AGENT_VERSION}"
          popd
          mv ./flutter/build/app/outputs/flutter-apk/app-${{ matrix.job.abi }}-release.apk \
             ./AcessoFast-${{ env.VERSION }}-${{ matrix.job.arch }}.apk
          ls -la ./AcessoFast-*.apk

      # AAB (Android App Bundle) — formato que a Play Store exige para publicar.
      # So roda quando 'gerar_aab' e marcado, pra nao dobrar o tempo dos builds de
      # teste. Reaproveita os jniLibs e o libc++_shared.so ja postos pelo step do
      # APK, e a MESMA assinatura release (key.properties ainda existe aqui — a
      # limpeza dos segredos vem depois). arm64-only, igual ao APK; a Play entrega
      # so pra aparelhos arm64, que e o escopo atual.
      #
      # O --dart-define aqui e obrigatorio, nao um detalhe: sem ele o bundle sai
      # com ACESSOFAST_VERSION="dev" e TODO aparelho instalado pela Play Store
      # reporta versao desconhecida no painel — justamente o buraco que a coluna
      # "Agente" existe pra fechar, e do jeito mais dificil de perceber, porque o
      # .apk lado a lado reporta certo.
      - name: Build AAB (Play Store)
        if: ${{ inputs.gerar_aab }}
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          # Vem do step do APK via GITHUB_ENV. Falhar aqui e melhor que publicar
          # na Play Store um bundle que se identifica como "dev".
          if [ -z "${AGENT_VERSION:-}" ]; then
            echo "::error::AGENT_VERSION vazio — o step do APK deveria te-lo exportado."
            exit 1
          fi
          echo "::notice::agent_version(aab)=${AGENT_VERSION}"
          pushd flutter
          flutter build appbundle --release --target-platform android-arm64 \
            --dart-define=ACESSOFAST_VERSION="${AGENT_VERSION}"
          popd
          mv ./flutter/build/app/outputs/bundle/release/app-release.aab \
             ./AcessoFast-${{ env.VERSION }}-${{ matrix.job.arch }}.aab
          ls -la ./AcessoFast-*.aab

      - name: Limpar segredos do workspace
        if: always()
        shell: bash
        run: |
          rm -f ./flutter/android/acessofast-upload.jks ./flutter/android/key.properties
          echo "keystore e key.properties removidos do workspace."

      - name: Publicar o APK AcessoFast como artefato
        uses: actions/upload-artifact@v4
        with:
          name: acessofast-android-${{ matrix.job.arch }}
          path: ./AcessoFast-${{ env.VERSION }}-${{ matrix.job.arch }}.apk
          if-no-files-found: error

      - name: Publicar o AAB AcessoFast como artefato (Play Store)
        if: ${{ inputs.gerar_aab }}
        uses: actions/upload-artifact@v4
        with:
          name: acessofast-android-${{ matrix.job.arch }}-aab
          path: ./AcessoFast-${{ env.VERSION }}-${{ matrix.job.arch }}.aab
          if-no-files-found: error
